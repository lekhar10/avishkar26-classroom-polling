version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: av26_postgres
    restart: always
    environment:
      POSTGRES_USER: codewarriors
      POSTGRES_PASSWORD: codewarriors_secret
      POSTGRES_DB: live_classroom_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codewarriors -d live_classroom_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: av26_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: av26_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://codewarriors:codewarriors_secret@postgres:5432/live_classroom_db
      - REDIS_URL=redis://redis:6379
      - CLIENT_ORIGIN=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: av26_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
